# ============================================================
#  CONFIGURACIÓN DE EMPRESA  —  UN ARCHIVO POR CLIENTE
#
#  Estos son los datos que cambian en cada instalación: al preparar
#  el bot para una empresa, se rellenan aquí y no se toca nada más.
#  Lo de abajo son DATOS DE PRUEBA, no los de ninguna empresa real.
#
#  Antes de entregarlo a un cliente, revisa:
#    company.*            sus datos fiscales (salen en cada factura)
#    invoice.tax_rate     21 general, pero hay quien factura al 10 o al 4
#    invoice.bank_account su IBAN — va impreso en el PDF
#    review.reviewers     quién puede aprobar facturas en la web
#    logo                 config/logo.png
#
#  Mientras no estén puestos, las facturas salen marcadas como PRUEBA.
# ============================================================

company:
  name: "EMPRESA DE PRUEBA, S.L."
  cif: "B00000000"
  address: "Calle de Ejemplo 1, 08001 Barcelona, España"
  phone: "+34 900 000 000"
  email: "pruebas@ejemplo.com"
  logo_path: "config/logo.png"   # Ruta al logo (PNG/JPG, 300x150 px recomendado)

invoice:
  tax_rate: 21            # Porcentaje de IVA
  currency: "EUR"
  currency_symbol: "€"
  payment_terms: "30 días"
  bank_account: "ES00 0000 0000 0000 0000 0000"   # IBAN de prueba
  # ¿Los precios que dictas ya llevan el IVA dentro?
  #   false → "150 euros" significa 150 + IVA  = 181,50 (lo habitual entre empresas)
  #   true  → "150 euros" significa 150 con IVA dentro = 123,97 + 26,03 de IVA
  # Digas lo que digas en el audio manda: "IVA incluido" o "más IVA" cambia
  # el criterio solo para esa factura.
  prices_include_tax: false

# ============================================================
#  DATOS OBLIGATORIOS
#  El bot los pedirá antes de emitir la factura si faltan.
#  El nombre del cliente y al menos un concepto son siempre obligatorios.
# ============================================================
required_fields:
  client_email: true     # necesario para poder enviarla por email
  client_id: true        # NIF/CIF — obligatorio en una factura española
  client_address: false  # recomendable, pero no lo exigimos por defecto

review:
  # "auto"   → la factura se envía al cliente inmediatamente (a tu propio riesgo;
  #            corrige con una factura rectificativa si algo falla).
  # "manual" → la factura queda pendiente de revisión en la página web antes de enviarse.
  mode: "manual"
  # Emails autorizados a iniciar sesión en la página de revisión.
  reviewers:
    - "gerardcampspinto136@gmail.com"
  notify:
    channels: ["telegram"]     # dónde avisar: "telegram", "email" o ambos
    schedule: "1d"             # cada cuánto recordar las facturas pendientes: 1d, 3d, 1w, 2w
    email: ""                  # email que recibe el aviso (si channels incluye "email")
    # Se pone en .env como TELEGRAM_CHAT_ID, no aquí: este archivo está en GitHub.
    telegram_chat_id: ""
  web:
    base_url: "http://localhost:8000"   # URL usada en los enlaces (usa la del túnel para el móvil)
    host: "127.0.0.1"
    port: 8000


# ============================================================
#  AVISOS DE DINERO Y STOCK
#  Se envían por los mismos canales que review.notify.channels.
# ============================================================
alerts:
  # Resumen de pagos a proveedores + facturas sin cobrar.
  # Vacío ("") para desactivarlo. Formatos: 1d, 3d, 1w, 2w.
  money_schedule: "1w"
  # Cuántos días vista se incluyen en el aviso de pagos a proveedores
  # (las facturas ya vencidas se incluyen siempre).
  bills_due_within_days: 7
  # Aviso de productos que han llegado a su punto de pedido.
  stock_schedule: "1w"

email:
  subject_template: "Factura {invoice_number} - {company_name}"
  body_template: |
    Estimado/a {client_name},

    Adjunto encontrará la factura {invoice_number} correspondiente a nuestros servicios,
    por un importe total de {total}.

    Quedo a su disposición para cualquier consulta.

    Un cordial saludo,
    {company_name}
    {company_phone}
    {company_email}
